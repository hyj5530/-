<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배달와와 - 가게 주인 관리자</title>
    <link rel="stylesheet" href="주인1.css">
</head>
<body>
    <div class="owner-container">
        <!-- 상단 헤더 -->
        <header class="owner-header">
            <div class="header-title-box">
                <span class="badge">STORE OWNER</span>
                <h1>가게 메뉴 관리</h1>
                <p>카테고리를 선택하고 판매하실 메뉴 이름과 가격을 입력해 주세요.</p>
            </div>
            <button class="back-btn" id="backBtn">처음으로</button>
        </header>

        <!-- 메인 콘텐츠 (좌우 분할) -->
        <div class="owner-content">
            <!-- 왼쪽: 입력 폼 영역 -->
            <div class="form-section">
                <form id="menuForm">
                    <!-- 카테고리 선택 (Select) -->
                    <div class="input-group">
                        <label for="category">음식 카테고리</label>
                        <select id="category" required>
                            <option value="" disabled selected>카테고리를 선택해주세요</option>
                            <option value="한식">한식</option>
                            <option value="중식">중식</option>
                            <option value="양식">양식</option>
                            <option value="일식">일식</option>
                            <option value="패스트푸드">패스트푸드</option>
                            <option value="분식">분식</option>
                            <option value="디저트">디저트</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="menuName">음식 이름</label>
                        <input type="text" id="menuName" placeholder="예: 마라 로제 떡볶이" required>
                    </div>

                    <div class="input-group">
                        <label for="menuPrice">가격 (원)</label>
                        <input type="number" id="menuPrice" placeholder="예: 12000" required>
                    </div>

                    <!-- 기존 <button type="submit" class="submit-btn">메뉴 등록하기</button> 를 아래로 변경 -->
                    <button type="button" class="submit-btn" id="submitBtn">메뉴 등록하기</button>
                </form>

                <!-- 등록된 메뉴 미리보기 목록 -->
                <div class="menu-list-preview">
                    <h3>등록된 메뉴 목록</h3>
                    <ul id="menuList">
                        <!-- 자바스크립트로 추가됨 -->
                        <li class="empty-item">아직 등록된 메뉴가 없습니다.</li>
                    </ul>
                </div>
            </div>

            <!-- 오른쪽: 강아지 사진 및 데코 영역 -->
            <div class="decoration-section">
                <div class="puppy-card">
                    <div class="img-container">
                        <img src="wawa.jpg" alt="일하는 귀여운 강아지" class="owner-puppy-img">
                    </div>
                    <div class="puppy-speech-bubble">
                        사장님, 대박 나세요! 🐾
                    </div>
                    <div class="stats-card">
                        <div class="stat-item">
                            <span class="stat-label">총 등록 메뉴</span>
                            <span class="stat-value" id="menuCount">0개</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="주인1.js"></script>
</body>
</html>
