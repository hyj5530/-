<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배달와와 - 실시간 배달 현황</title>
    <link rel="stylesheet" href="손님2.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="customer-container">
        <!-- 상단 헤더 -->
        <header class="customer-header">
            <div class="header-title-box">
                <span class="badge">DELIVERY STATUS</span>
                <h1>실시간 주문 · 배달 현황</h1>
                <p>가게의 조리 상태와 배달 출발 여부를 실시간으로 확인해 보세요!</p>
            </div>
            <div class="header-btn-group">
                <button class="back-btn menu-back-btn" id="menuBackBtn">메뉴판으로</button>
                <button class="back-btn" id="homeBtn">홈으로</button>
            </div>
        </header>

        <!-- 마스코트 안내 배너 -->
        <div class="status-banner">
            <img src="wawa.jpg" alt="배달 치와와" class="status-puppy-img">
            <div class="status-banner-text">
                <h2>배달 치와와가 실시간으로 상태를 알려드려요! 🐾</h2>
                <p>가게 사장님이 버튼을 누르면 아래 진행 단계가 자동으로 업데이트됩니다.</p>
            </div>
        </div>

        <!-- 실시간 주문 현황 리스트 -->
        <div class="status-list-section" id="orderStatusList">
            <div class="empty-status">주문 내역을 불러오는 중입니다... 🐾</div>
        </div>
    </div>

    <script type="module" src="손님2.js"></script>
</body>
</html>
