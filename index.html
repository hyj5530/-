<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>배달</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <!-- 1. 헤더: '배달' 글자만 배치 -->
  <header class="header">
    <h1>배달</h1>
  </header>

  <!-- 2. 메인 컨테이너 -->
  <main class="container">
    
    <!-- 메뉴 이름 & 가격 입력창 -->
    <form class="menu-form">
      <div class="input-group">
        <label for="menu-name">메뉴 이름</label>
        <input type="text" id="menu-name" placeholder="메뉴명을 입력하세요">
      </div>

      <div class="input-group">
        <label for="menu-price">가격</label>
        <input type="text" id="menu-price" placeholder="가격을 입력하세요">
      </div>

      <button type="button" class="btn-submit">등록하기</button>
    </form>

    <!-- ⭐ 강아지 사진 들어가는 곳 ⭐ -->
    <div class="photo-box">
      <img src="https://img.petokoto.com/media/2020/06/esfdhj.jpg" alt="강아지 사진">
    </div>

  </main>

</body>
</html>
