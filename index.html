<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배달와와 - 환영합니다</title>
    <link rel="stylesheet" href="1003.css">
</head>
<body>
    <div class="welcome-container">
        <!-- 강아지 사진 (귀여운 강아지 무료 이미지 예시) -->
        <div class="image-wrapper">
            <img src="wawa.jpg" alt="귀여운 강아지 마스코트" class="puppy-img">
        </div>

        <!-- 큰 제목 -->
        <h1 class="main-title">배달와와</h1>

        <!-- 작은 환영 멘트 -->
        <p class="sub-title">배달와와에 오신 것을 환영합니다!</p>

        <!-- 선택 버튼 영역 -->
        <div class="button-group">
            <button class="role-btn owner-btn" id="ownerBtn">가게 주인</button>
            <button class="role-btn customer-btn" id="customerBtn">손님</button>
        </div>
    </div>

    <script src="1003.js"></script>
